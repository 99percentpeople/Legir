[package]
name = "Legir"
version = "0.2.0"
description = "Legir PDF Reader"
authors = ["Zach Yuen <yuenzach99@gmail.com>"]
repository = "https://github.com/99percentpeople/Legir"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.94"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.35"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2.10.2"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
tauri-plugin-opener = "2.7.3"
whoami = "2.1.3"
fontdb = "0.24.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2.5.0"
tauri-plugin-single-instance = "2.5.5"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.
debug = 0 # Keep release artifacts small without unstable compiler flags.
