name: build-tauri

on:
  workflow_dispatch:
  push:
    # A version tag uses the release workflow, not a second full matrix build.
    branches: ["**"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "generated-icons/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - ".cargo/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "rust-toolchain.toml"
      - "vite.config.ts"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "eslint.config.js"
      - "www/src/lib/downloads.ts"
      - "www/src/lib/app-url.ts"
      - ".github/workflows/tauri-*.yml"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "generated-icons/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - ".cargo/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "rust-toolchain.toml"
      - "vite.config.ts"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "eslint.config.js"
      - "www/src/lib/downloads.ts"
      - "www/src/lib/app-url.ts"
      - ".github/workflows/tauri-*.yml"

permissions:
  contents: read

concurrency:
  group: tauri-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/tauri-bundles.yml
