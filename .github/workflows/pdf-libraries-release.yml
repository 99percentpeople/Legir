name: publish-pdf-libraries

on:
  push:
    tags: ["pdf-libs-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing library tag (pdf-libs-vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# Different release versions must not race to update npm's latest tag.
concurrency:
  group: pdf-libraries-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      # Keep current publishing tools separate so manual dispatch can also
      # publish older tags that predate npm distribution.
      - uses: actions/checkout@v5
        with:
          path: tooling
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          path: source
      - name: Verify workflow and release source identity
        run: |
          if [ "$(git -C source rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Run this workflow from the release tag so OIDC provenance matches its source." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@legir"
      - run: npm --version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: source
      - run: bun run build:packages && bun run check:boundaries
        working-directory: source
      - run: bun x vitest run --project pdf-model --project pdf-core --project pdf-renderer && bun x vitest run tests/pdfLibrary*.test.ts
        working-directory: source
      - run: bun run --cwd packages/pdfium test
        working-directory: source
      - name: Pack npm tarballs from the exact tagged source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bun tooling/scripts/pack-npm-libraries.ts source "$RELEASE_TAG" release-assets
      - name: Verify tarball and manifest checksums
        run: (cd release-assets && sha256sum -c SHA256SUMS.txt)
      - name: Check the packaged consumer outside the source repository
        run: node tooling/scripts/check-package-consumer.mjs release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-libraries
          path: release-assets/
          if-no-files-found: error
      - name: Publish to npm using trusted publishing (OIDC)
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          node tooling/scripts/publish-npm-libraries.mjs release-assets
