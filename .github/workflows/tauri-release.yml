name: publish-tauri

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable version tag to publish, e.g. v0.1.0"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: tauri-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - name: Verify tag and app versions
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          bun run check:desktop "$RELEASE_TAG"
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    uses: ./.github/workflows/tauri-bundles.yml
    with:
      ref: ${{ needs.preflight.outputs.tag }}

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - name: Download all platform packages
        uses: actions/download-artifact@v5
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Verify selected installers and no-install packages and generate checksums
        run: bun scripts/desktop-release.ts prepare release-assets
      - name: Publish only after every package has been uploaded
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/release-is-draft; then
            if [ "$(< /tmp/release-is-draft)" != "true" ]; then
              echo "Refusing to overwrite an already published release. Use a new version tag." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Legir $RELEASE_TAG" --generate-notes \
              --notes "Windows: EXE installer or portable ZIP (requires WebView2). Linux: DEB installer or no-install AppImage. macOS: DMG or the complete app in a portable TAR.GZ archive. Choose the matching architecture. No-install packages still use the normal per-user app data location. SHA256SUMS.txt contains file checksums. Early builds are not Windows code-signed or Apple-notarized; macOS builds use ad-hoc signing. See docs/DESKTOP_RELEASE.md for usage notes."
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
