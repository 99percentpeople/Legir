name: build-www

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "www/**"
      - "src/**"
      - "public/**"
      - "packages/pdf-model/**"
      - "config/vite/workspacePackages.ts"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/www-build.yml"
  pull_request:
    paths:
      - "www/**"
      - "src/**"
      - "public/**"
      - "packages/pdf-model/**"
      - "config/vite/workspacePackages.ts"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/www-build.yml"

permissions:
  contents: read

concurrency:
  group: www-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.dependencies }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        dependencies: [clean, cached-isolated]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Seed the previous isolated Markdown dependencies
        if: matrix.dependencies == 'cached-isolated'
        run: |
          mkdir -p "$RUNNER_TEMP/www-old-deps"
          cat > "$RUNNER_TEMP/www-old-deps/package.json" <<'JSON'
          {
            "private": true,
            "dependencies": {
              "micromark": "4.0.2",
              "micromark-extension-gfm": "3.0.0"
            },
            "overrides": { "micromark-util-types": "2.0.2" }
          }
          JSON
          bun install --cwd "$RUNNER_TEMP/www-old-deps" --linker isolated --ignore-scripts
          mv "$RUNNER_TEMP/www-old-deps/node_modules" node_modules
      # Exercise the exact Vercel install command, including repair of links
      # restored from an older isolated node_modules cache.
      - name: Install website dependencies
        working-directory: www
        run: |
          node -e "require('node:child_process').execSync(require('./vercel.json').installCommand, { stdio: 'inherit' })"
      - run: bun run build:www
