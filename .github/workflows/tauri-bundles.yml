name: tauri-bundles

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build; empty uses the caller's ref.
        type: string
        default: ""
      release:
        description: Full optimized installers for a stable tag; false builds fast no-install editions.
        type: boolean
        default: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-
      - run: bun install --frozen-lockfile
      - run: bun run check:desktop
      - run: bun run lint
      - run: bun run test
      # Root test already includes all four PDF library projects.
      - run: bun run test:consumer

  build:
    needs: validate
    env:
      # Both modes are release binaries (no devtools/debug frontend). Daily
      # builds trade binary size/optimization for shorter compile and link time.
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.release && 'true' || 'false' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.release && '1' || '16' }}
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ inputs.release && 's' || '1' }}
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/legir
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Record the checked-out commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xdg-utils libssl-dev libxdo-dev file

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ env.BUN_VERSION }}-

      - name: Read the pinned Rust toolchain
        id: rust
        shell: bash
        run: |
          echo "toolchain=$(bun -e 'console.log(Bun.TOML.parse(await Bun.file("rust-toolchain.toml").text()).toolchain.channel)')" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          targets: ${{ matrix.target }}

      - name: Restore Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          shared-key: tauri-${{ inputs.release && 'release' || 'dev' }}-${{ matrix.target }}
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      - run: bun install --frozen-lockfile

      - name: Build native packages for the selected channel
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          if [ "$RELEASE" = "true" ]; then
            bun run build:app --target "$TARGET" --bundles "$BUNDLES" --ci -- --locked
          elif [[ "$TARGET" == *apple-darwin ]]; then
            # A usable macOS portable edition needs the complete .app, not DMG.
            bun run build:app --target "$TARGET" --bundles app --ci -- --locked
          else
            bun run build:app --target "$TARGET" --no-bundle --ci -- --locked
          fi

      - name: Stage installers with a flat layout
        if: inputs.release
        run: bun scripts/desktop-release.ts stage src-tauri/target/${{ matrix.target }}/release/bundle desktop-dist

      - name: Stage no-install editions (Linux ships the native executable)
        run: bun scripts/desktop-portable.ts ${{ matrix.target }} src-tauri/target/${{ matrix.target }}/release desktop-dist

      - name: Upload installers and no-install packages
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ inputs.release && 'release' || 'dev' }}-${{ matrix.target }}-${{ steps.source.outputs.sha }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: desktop-dist/*
